services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      LOCAL_UPLOAD_DIR: /app/uploads
      # Point to your deployed ss_service instance
      # SCREENSHOT_SERVICE_URL: http://<ss_service_host>:8000
    volumes:
      - uploads:/app/uploads

volumes:
  uploads:
